name: Release — Build MSIX & Deploy to Store

on:
  push:
    tags: ["v*"]

permissions:
  contents: write

env:
  DOTNET_VERSION: "10.0.x"

jobs:
  build-msix:
    name: Build MSIX (${{ matrix.platform }})
    runs-on: windows-latest
    strategy:
      matrix:
        platform: [x64, arm64]
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: ${{ env.DOTNET_VERSION }}

      - name: Extract version from tag
        id: version
        shell: pwsh
        run: |
          $tag = "${{ github.ref_name }}" -replace '^v', ''
          # Ensure 4-part version (e.g. 1.2.0 → 1.2.0.0)
          $parts = $tag.Split('.')
          while ($parts.Count -lt 4) { $parts += '0' }
          $version = $parts -join '.'
          echo "VERSION=$version" >> $env:GITHUB_OUTPUT
          echo "TAG_VERSION=$tag" >> $env:GITHUB_OUTPUT
          Write-Host "Version: $version"

      - name: Decode signing certificate
        shell: pwsh
        run: |
          $pfxBytes = [Convert]::FromBase64String("${{ secrets.STORE_CERTIFICATE_BASE64 }}")
          [IO.File]::WriteAllBytes("${{ github.workspace }}\SigningCert.pfx", $pfxBytes)

      - name: Update manifest version
        shell: pwsh
        run: |
          $manifest = Get-Content "Package.appxmanifest" -Raw
          $manifest = $manifest -replace 'Version="[\d\.]+"', "Version=`"${{ steps.version.outputs.VERSION }}`""
          $manifest = $manifest -replace 'Publisher="[^"]*"', 'Publisher="${{ secrets.STORE_PUBLISHER_ID }}"'
          $manifest = $manifest -replace 'Name="[^"]*"', 'Name="${{ secrets.STORE_PACKAGE_IDENTITY }}"'
          Set-Content "Package.appxmanifest" $manifest
          Write-Host "Updated manifest to version ${{ steps.version.outputs.VERSION }}"

      - name: Build MSIX package
        run: >
          dotnet publish WinPrompter.csproj
          -p:Platform=${{ matrix.platform }}
          -c Release
          -p:WindowsPackageType=MSIX
          -p:AppxBundle=Never
          -p:AppxPackageSigningEnabled=true
          -p:PackageCertificateKeyFile="${{ github.workspace }}\SigningCert.pfx"
          -p:PackageCertificatePassword="${{ secrets.STORE_CERTIFICATE_PASSWORD }}"
          -p:GenerateAppxPackageOnBuild=true
          -p:AppxPackageDir="${{ github.workspace }}\AppPackages\${{ matrix.platform }}\"

      - name: Remove signing certificate
        if: always()
        shell: pwsh
        run: |
          if (Test-Path "${{ github.workspace }}\SigningCert.pfx") {
            Remove-Item "${{ github.workspace }}\SigningCert.pfx" -Force
          }

      - name: Upload MSIX artifact
        uses: actions/upload-artifact@v4
        with:
          name: msix-${{ matrix.platform }}
          path: ${{ github.workspace }}/AppPackages/${{ matrix.platform }}/**/*.msix
          retention-days: 30

  create-release:
    name: Create GitHub Release
    needs: build-msix
    runs-on: ubuntu-latest
    steps:
      - name: Download all MSIX artifacts
        uses: actions/download-artifact@v4
        with:
          path: artifacts
          pattern: msix-*

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
          files: artifacts/**/*.msix
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  store-submit:
    name: Submit to Microsoft Store
    needs: build-msix
    runs-on: ubuntu-latest
    if: ${{ vars.ENABLE_STORE_SUBMIT == 'true' }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Download x64 MSIX
        uses: actions/download-artifact@v4
        with:
          name: msix-x64
          path: packages/x64

      - name: Download ARM64 MSIX
        uses: actions/download-artifact@v4
        with:
          name: msix-arm64
          path: packages/arm64

      - name: Locate package to submit
        id: pkg
        shell: pwsh
        run: |
          # msstore publish takes a single .msixbundle/.msixupload/.msix.
          # Prefer a bundle, since that is what carries multiple architectures.
          $pkg = Get-ChildItem -Path packages -Recurse -Include *.msixupload,*.msixbundle | Select-Object -First 1
          if (-not $pkg) {
            $msix = @(Get-ChildItem -Path packages -Recurse -Filter *.msix)
            if ($msix.Count -gt 1) {
              Write-Error "Found $($msix.Count) .msix files but no .msixbundle. The Store expects a single bundle for multi-architecture submissions - build with -p:AppxBundle=Always (or run makeappx bundle) and re-run."
              exit 1
            }
            $pkg = $msix | Select-Object -First 1
          }
          if (-not $pkg) { Write-Error "No package found under packages/"; exit 1 }
          echo "path=$($pkg.FullName)" >> $env:GITHUB_OUTPUT

      - name: Set up MSStore CLI
        uses: microsoft/microsoft-store-apppublisher@cc9910a8d59f2eb55cbb83df0a3800cf3b5300e0 # v1.4
        with:
          version: v0.4.1

      - name: Configure Store Credentials
        shell: bash
        env:
          STORE_SELLER_ID: ${{ secrets.STORE_SELLER_ID }}
          STORE_TENANT_ID: ${{ secrets.AZURE_TENANT_ID }}
          STORE_CLIENT_ID: ${{ secrets.AZURE_CLIENT_ID }}
          STORE_CLIENT_SECRET: ${{ secrets.AZURE_CLIENT_SECRET }}
        run: >-
          msstore reconfigure
          --tenantId "$STORE_TENANT_ID"
          --sellerId "$STORE_SELLER_ID"
          --clientId "$STORE_CLIENT_ID"
          --clientSecret "$STORE_CLIENT_SECRET"

      - name: Submit to Microsoft Store
        shell: bash
        env:
          STORE_PRODUCT_ID: ${{ secrets.STORE_PRODUCT_ID }}
          PACKAGE_PATH: ${{ steps.pkg.outputs.path }}
        run: msstore publish "$PACKAGE_PATH" --appId "$STORE_PRODUCT_ID"
